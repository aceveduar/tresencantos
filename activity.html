<head>

</head>

      <a href="admin.html" class="tbn-icon" title="Inventario">

        <span class="tbn-label">Inventario</span>

      <a href="stats.html" class="tbn-icon" title="Reportes">

        <span class="tbn-label">Reportes</span>

    <span class="tbn-sep"></span>
    <span class="user-avatar" id="user-avatar" style="cursor:pointer" title="Mi cuenta">?</span>
  </div>
</div>

<div class="main">
  <div class="act-search-wrap">
    <input type="search" class="act-search-input" id="filter-search" placeholder="🔍 Buscar cliente, producto o nota…" oninput="onSearchInput()" autocomplete="off">
    <button type="button" class="act-search-clear" id="filter-search-clear" onclick="clearSearch()" style="display:none" title="Limpiar búsqueda">✕</button>
  </div>

  <div class="filters-bar">
    <select class="filter-select" id="filter-period" onchange="load()">
      <option value="1" selected>Hoy</option>
      <option value="7">7 días</option>
      <option value="30">30 días</option>
      <option value="0">Todo</option>
    </select>
    <select class="filter-select" id="filter-user" onchange="load()">
      <option value="">Todos</option>
    </select>
    <div class="chip-group-wrap" id="chip-group-wrap">
      <div class="chip-group" id="chip-group" onscroll="_chipsScroll()">
        <button class="chip active" data-type="" onclick="setType(this,'')">Todos</button>
        <button class="chip" data-type="venta" onclick="setType(this,'venta')"><svg style="width:13px;height:13px;vertical-align:-2px;margin-right:3px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>Ventas</button>
        <button class="chip" data-type="inventario" onclick="setType(this,'inventario')"><svg style="width:13px;height:13px;vertical-align:-2px;margin-right:3px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>Inventario</button>
        <button class="chip" data-type="apartado" onclick="setType(this,'apartado')"><svg style="width:13px;height:13px;vertical-align:-2px;margin-right:3px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>Apartados</button>
      </div>
    </div>
  </div>

  <div class="summary-row" id="summary-row" style="display:none">
    <div class="sum-card">
      <div class="sum-val" id="sum-ventas">—</div>
      <div class="sum-sub" id="sum-ventas-sub"></div>
      <div class="sum-lbl">Ventas</div>
    </div>
    <div class="sum-card">
      <div class="sum-val" id="sum-apt">—</div>
      <div class="sum-sub muted" id="sum-apt-sub"></div>
      <div class="sum-lbl">Apartados</div>
    </div>
    <div class="sum-card">
      <div class="sum-val" id="sum-inv">—</div>
      <div class="sum-sub muted" id="sum-inv-sub"></div>
      <div class="sum-lbl">Inventario</div>
    </div>
  </div>

  <div id="feed"><div class="spinner"></div></div>
</div>

<script src="activity.js"></script>
<script src="shared.js"></script>
</body>
</html>
